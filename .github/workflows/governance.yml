name: Nomos Governance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  constitutional-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Nomos governance lint
        run: python tools/nomos_lint.py
